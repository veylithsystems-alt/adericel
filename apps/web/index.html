    <!--
      Brand typefaces are loaded as a progressive enhancement. Every font token
      carries a real fallback stack, so an air-gapped or restricted deployment
      renders correctly without reaching an external host. The interface must
      never depend on a third-party origin to be legible.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
